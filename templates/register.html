{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Create account</h1>
  <p class="muted">Start organising your tasks today.</p>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button class="btn btn-primary full">Register</button>
  </form>
  <p class="muted center">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
